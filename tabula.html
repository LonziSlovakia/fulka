<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>FULka – tabuľa</title>
<meta name="theme-color" content="#050505">
<link rel="icon" type="image/png" href="assets/logos/ful-mark-white.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Saira:wght@400;500;600;700;800&family=Saira+Extra+Condensed:wght@600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=202611211330">
<link rel="stylesheet" href="board.css?v=202611211330">
<style>html, body { height: 100%; overflow: hidden; background: #050505; } html:fullscreen { cursor: none; } #board { position: fixed; inset: 0; }</style>
</head>
<body>
<!-- Druhá obrazovka: ukazuje to, čo ovládaš v admine (?edit → Tabuľa). Funguje iba v tom istom prehliadači (stav sa prenáša cez localStorage). -->
<div id="board" aria-live="off"></div>
<noscript><p style="padding:24px">Tabuľa potrebuje zapnutý JavaScript.</p></noscript>
<script src="board.js?v=202611211330"></script>
<script src="board-view.js?v=202611211330"></script>
<script>
(() => {
  "use strict";
  const root = document.getElementById("board");
  let state = Board.load();
  BoardView.render(root, state);
  Board.subscribe((s) => { state = s; BoardView.render(root, state); });
  setInterval(() => BoardView.update(root, state), 100);
  setInterval(Board.ping, 2000);
  Board.ping();
  // F = celá obrazovka (kurzor sa schová, kým je tabuľa otvorená)
  document.addEventListener("keydown", (e) => {
    if (e.key === "f" || e.key === "F") { if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen().catch(() => {}); }
  });
  document.addEventListener("dblclick", () => { if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen().catch(() => {}); });
})();
</script>
</body>
</html>
