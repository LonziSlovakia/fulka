<!doctype html>
<meta charset="utf-8">
<title>Kuchynka Ants – zdroj loga (4 verzie)</title>
<!-- Logo Kuchynka Ants podľa Lonziho predlohy (predloha/koncepty.png, koncept vpravo hore): hlava mravca z profilu bez šesťuholníka,
     bez spodného pravého dielika (alebo zlúčeného s vrchom hlavy), vedľa predmet z kuchyne (ako zvonček pri Rangers).
     Každá verzia je funkcia času t (0 = začiatok, 1 = koniec animácie) → SVG 512×512.
     ?v=1&t=0.5 → iba jedno logo (snímky pre tools/logo-render.js), bez parametrov → všetky 4 sa animujú. -->
<style>
  html, body { margin: 0; background: transparent; }
  body.preview { background: #050505; color: #fff; font-family: system-ui, sans-serif; display: flex; flex-wrap: wrap; gap: 16px; padding: 16px; }
  body.preview figure { margin: 0; background: #111; padding: 8px; } body.preview svg { width: 300px; height: 300px; display: block; }
  body.one svg { width: 512px; height: 512px; display: block; }
</style>
<body>
<script src="traced-zlucene.js"></script>
<script>
"use strict";
// ---------- farby (z predlohy) ----------
const CREAM = "#FCF6E8", INK = "#0A0A0A";
const O = { hi: "#FFA24A", lt: "#FF8424", c: "#EE6A12", md: "#D2560C", dk: "#A8420A", dp: "#6E2A05" };
const WOOD = { hi: "#F4D6A6", lt: "#E3B97A", md: "#C88F52", dk: "#8E5B2A" };
const STEEL = { hi: "#F2F5F7", lt: "#D3DADF", md: "#A3ADB4", dk: "#5B666D" };

// ---------- pomocné funkcie ----------
// predloha je kreslená v súradniciach výrezu 870×960, M ju prevedie do loga 512×512
const M = ([x, y]) => [x * 0.56 - 30, y * 0.56 - 12];
const pts = (p) => p.map(M).map(([x, y]) => `${x.toFixed(1)},${y.toFixed(1)}`).join(" ");
const ptsRaw = (p) => p.map(([x, y]) => `${x.toFixed(1)},${y.toFixed(1)}`).join(" ");
const poly = (p, fill, extra = "") => `<polygon points="${pts(p)}" fill="${fill}" ${extra}/>`;
const polyRaw = (p, fill, extra = "") => `<polygon points="${ptsRaw(p)}" fill="${fill}" ${extra}/>`;
const cut = (p, w = 4) => `<polyline points="${pts(p)}" fill="none" stroke="${INK}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round"/>`;
const rotAt = (deg, p, s) => { const [x, y] = M(p); return `<g transform="rotate(${deg.toFixed(2)} ${x.toFixed(1)} ${y.toFixed(1)})">${s}</g>`; };
const phase = (t, a, b) => Math.min(1, Math.max(0, (t - a) / (b - a)));
// kmitanie medzi časmi a a b (n kmitov, doznie), mimo toho 0
const wiggle = (t, a, b, deg, n = 2) => { const u = phase(t, a, b); return u <= 0 || u >= 1 ? 0 : deg * Math.sin(u * Math.PI * 2 * n) * (1 - u); };
// časť loga = obrys (sil → krémový a čierny okraj) + kresba (art)
const part = (sil, art) => ({ sil, art });
// sil môže byť aj funkcia hrúbky ťahu (vektor z predlohy má iné mierky a hrúbku si prepočíta sám)
function sticker(parts, defs = "") {
  const sil = (w) => parts.map((p) => (typeof p.sil === "function" ? p.sil(w) : p.sil)).join("");
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512"><defs>${defs}</defs><g id="all">
    <g fill="${CREAM}" stroke="${CREAM}" stroke-width="34" stroke-linejoin="round">${sil(34)}</g>
    <g fill="${INK}" stroke="${INK}" stroke-width="14" stroke-linejoin="round">${sil(14)}</g>
    ${parts.map((p) => p.art).join("")}</g></svg>`;
}

// obrys cez filter: celý zložený tvar (čierna výplň) sa rozšíri na čiernu a krémovú linku – aj pri pootočených častiach ostane súvislý
// (rozšírenie = rozmazanie + orezanie priehľadnosti; krémová ~17 px, čierna ~7 px ako ťahy 34 a 14 pri verziách 1–2)
const STK = `<filter id="stk" x="-30%" y="-30%" width="160%" height="160%" color-interpolation-filters="sRGB">`
  + `<feGaussianBlur in="SourceAlpha" stdDeviation="11.3" result="b1"/><feComponentTransfer in="b1" result="a1"><feFuncA type="linear" slope="60" intercept="-3.5"/></feComponentTransfer>`
  + `<feFlood flood-color="${CREAM}"/><feComposite in2="a1" operator="in" result="cream"/>`
  + `<feGaussianBlur in="SourceAlpha" stdDeviation="4.7" result="b2"/><feComponentTransfer in="b2" result="a2"><feFuncA type="linear" slope="60" intercept="-3.5"/></feComponentTransfer>`
  + `<feFlood flood-color="${INK}"/><feComposite in2="a2" operator="in" result="ink"/>`
  + `<feMerge><feMergeNode in="cream"/><feMergeNode in="ink"/><feMergeNode in="SourceGraphic"/></feMerge></filter>`;
function stickerF(parts, defs = "") {
  const sil = parts.map((p) => (typeof p.sil === "function" ? p.sil() : p.sil)).join("");
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512"><defs>${STK}${defs}</defs><g id="all">
    <g filter="url(#stk)" fill="${INK}">${sil}</g>
    ${parts.map((p) => p.art).join("")}</g></svg>`;
}

// ---------- hlava mravca ----------
// tykadlo vpredu: zvislý článok z hlavy a zalomený článok dopredu; zadné tykadlo je tmavšie, za hlavou
const ANT_BASE = [478, 286];
const ANT1_UP = [[456, 292], [448, 118], [480, 80], [498, 88], [502, 292]];
const ANT1_FW = [[486, 80], [188, 206], [210, 224], [460, 134]]; // zalomený článok sa zužuje do hrotu
const ANT2_UP = [[526, 290], [520, 160], [544, 142], [556, 288]];
const ANT2_FW = [[544, 142], [360, 200], [376, 212], [528, 176]];
function antennae(deg) {
  const back = rotAt(deg * 0.7, [540, 286], poly(ANT2_UP, O.dk) + poly(ANT2_FW, O.dk) + poly([[544, 142], [360, 200], [368, 202], [538, 154]], O.md));
  const front = rotAt(deg, ANT_BASE, poly(ANT1_UP, O.md) + poly([[456, 292], [448, 118], [480, 80], [474, 122], [474, 292]], O.lt)
    + poly(ANT1_FW, O.c) + poly([[486, 80], [188, 206], [198, 210], [478, 98]], O.hi));
  const sil = rotAt(deg * 0.7, [540, 286], poly(ANT2_UP, "#000") + poly(ANT2_FW, "#000")) + rotAt(deg, ANT_BASE, poly(ANT1_UP, "#000") + poly(ANT1_FW, "#000"));
  return [part(sil, back + front)];
}
// vrch hlavy s okom; merged = spodný pravý dielik zlúčený s hlavou (inak chýba)
const HEAD_TOP = [[168, 578], [196, 520], [236, 430], [300, 372], [372, 330], [440, 292], [520, 272], [640, 250], [722, 248], [690, 322], [744, 350], [770, 410], [752, 470], [640, 500], [520, 530], [430, 562], [345, 600], [262, 628], [214, 616]];
const HEAD_MERGED = [[168, 578], [196, 520], [236, 430], [300, 372], [372, 330], [440, 292], [520, 272], [640, 250], [722, 248], [690, 322], [744, 350], [782, 420], [792, 520], [760, 610], [690, 680], [590, 722], [490, 728], [430, 690], [400, 640], [345, 610], [262, 628], [214, 616]];
function head(merged, blink = 0) {
  const shape = merged ? HEAD_MERGED : HEAD_TOP;
  const art = [poly(shape, O.c)];
  if (merged) art.push(poly([[620, 430], [752, 470], [792, 520], [760, 610], [690, 680], [590, 722], [490, 728], [430, 690], [520, 600], [640, 520]], O.md),
    poly([[640, 520], [792, 520], [760, 610], [690, 680], [600, 640]], O.dk), cut([[430, 690], [520, 600], [640, 520], [752, 470]], 5));
  art.push(
    poly([[236, 430], [300, 372], [372, 330], [440, 292], [520, 272], [640, 250], [722, 248], [690, 322], [560, 332], [430, 382], [304, 452]], O.lt),
    poly([[440, 292], [520, 272], [640, 250], [722, 248], [708, 268], [520, 298]], O.hi),
    poly([[690, 322], [744, 350], [770, 410], [752, 470], [640, 500], [622, 432]], O.md),
    poly([[168, 578], [214, 616], [262, 628], [345, 600], [334, 562], [238, 574]], O.dk),
    poly([[334, 562], [345, 600], [430, 562], [520, 530], [640, 500], [604, 468], [470, 502]], O.md),
    cut([[622, 432], [690, 322]]), cut([[304, 452], [238, 574]]), cut([[238, 574], [334, 562], [470, 502], [604, 468]]));
  // oko: mandľové, zamračené; blink = záblesk lesku (0–1)
  const big = (p) => p.map(([x, y]) => [430 + (x - 430) * 1.25, 455 + (y - 455) * 1.25]); // oko o štvrtinu väčšie ako v prvom obkreslení
  art.push(poly(big([[296, 532], [350, 472], [420, 422], [550, 368], [502, 442], [440, 492], [360, 527]]), INK));
  art.push(poly(big([[402, 472], [464, 428], [448, 470]]), "#FFFFFF"));
  if (blink > 0.02) {
    const [gx, gy] = M([452, 446]);
    art.push(`<g opacity="${blink.toFixed(2)}">${poly(big([[392, 478], [486, 416], [456, 478]]), "#FFFFFF")}<circle cx="${gx}" cy="${gy}" r="${(4 + 10 * blink).toFixed(1)}" fill="#FFFFFF" opacity="0.8"/></g>`);
  }
  return part(poly(shape, "#000"), art.join(""));
}
// kusadlá: dva háky dole vľavo; open = otvorenie (stupne), kladné = od seba
const MAND1 = [[196, 600], [150, 598], [108, 622], [86, 672], [94, 736], [110, 772], [128, 722], [150, 692], [178, 678], [208, 668], [224, 640]];
const MAND2 = [[296, 636], [376, 628], [414, 662], [402, 718], [352, 772], [270, 814], [300, 756], [334, 712], [338, 680], [298, 668]];
function mandibles(open) {
  const m1 = rotAt(open, [206, 618], poly(MAND1, O.c) + poly([[150, 598], [108, 622], [86, 672], [94, 736], [110, 772], [112, 712], [132, 660], [176, 622]], O.lt) + poly([[196, 600], [224, 640], [208, 668], [178, 678], [176, 640]], O.dk));
  const m2 = rotAt(-open, [330, 640], poly(MAND2, O.c) + poly([[296, 636], [376, 628], [352, 660], [318, 704], [270, 814], [300, 720], [318, 676]], O.lt) + poly([[376, 628], [414, 662], [402, 718], [352, 772], [368, 700]], O.dk));
  const sil = rotAt(open, [206, 618], poly(MAND1, "#000")) + rotAt(-open, [330, 640], poly(MAND2, "#000"));
  return part(sil, m1 + m2);
}

// ---------- predmety z kuchyne (súradnice priamo v logu 512×512) ----------
// obracačka: rúčka od bodu (x, y) pod uhlom ang, oranžová rúčka a kovová lopatka so štrbinami (ako v predlohe)
function spatula(x, y, ang, L = 230) {
  const g = (s) => `<g transform="translate(${x} ${y}) rotate(${ang.toFixed(2)})">${s}</g>`;
  const handle = [[0, -13], [L * 0.5, -11], [L * 0.5, 11], [0, 13]];
  const neck = [[L * 0.5, -6], [L * 0.62, -6], [L * 0.62, 6], [L * 0.5, 6]];
  const blade = [[L * 0.6, -40], [L, -48], [L + 8, 0], [L, 48], [L * 0.6, 40]];
  const slots = [-22, 0, 22].map((o) => polyRaw([[L * 0.68, o - 4], [L * 0.94, o - 5], [L * 0.94, o + 5], [L * 0.68, o + 4]], STEEL.dk)).join("");
  const art = polyRaw(handle, O.c) + polyRaw([[0, -13], [L * 0.5, -11], [L * 0.5, -3], [0, -4]], O.hi) + polyRaw([[0, 5], [L * 0.5, 4], [L * 0.5, 11], [0, 13]], O.dk)
    + `<circle cx="${L * 0.08}" cy="0" r="4" fill="${INK}"/>` + polyRaw(neck, STEEL.md)
    + polyRaw(blade, STEEL.lt) + polyRaw([[L * 0.6, -40], [L, -48], [L + 8, 0], [L * 0.6, 0]], STEEL.hi) + slots;
  return part(g(polyRaw(handle, "#000") + polyRaw(neck, "#000") + polyRaw(blade, "#000")), g(art));
}
// valček: stred (cx, cy), os pod uhlom ang, dĺžka L; roll = posun kolmo na os (gúľa sa), pásy dreva sa točia podľa posunu
function rollingPin(cx, cy, ang, L = 200, roll = 0) {
  const r = L * 0.135, h = L * 0.058, k = 0.17 * L, half = L / 2;
  const g = (s) => `<g transform="translate(${cx} ${cy}) rotate(${ang}) translate(0 ${roll.toFixed(2)})">${s}</g>`;
  const rect = (x1, x2, y1, y2) => [[x1, y1], [x2, y1], [x2, y2], [x1, y2]];
  const body = rect(-half + k, half - k, -r, r), hl = rect(-half, -half + k, -h, h), hr = rect(half - k, half, -h, h);
  // pásy na valci: uhol = posun / polomer; vidno iba prednú polovicu
  const turn = -roll / r;
  const bands = [0, 1, 2, 3].map((i) => {
    const a = turn + (i * Math.PI) / 2, y = r * Math.sin(a);
    return Math.cos(a) > 0.15 ? polyRaw(rect(-half + k + 4, half - k - 4, y - 2.5, y + 2.5), WOOD.dk, `opacity="${(0.25 + 0.35 * Math.cos(a)).toFixed(2)}"`) : "";
  }).join("");
  const art = polyRaw(hl, WOOD.md) + polyRaw(hr, WOOD.md) + polyRaw(rect(-half, -half + k, -h, -3), WOOD.lt) + polyRaw(rect(half - k, half, -h, -3), WOOD.lt)
    + `<circle cx="${-half}" cy="0" r="${h}" fill="${WOOD.md}"/><circle cx="${half}" cy="0" r="${h}" fill="${WOOD.md}"/>`
    + polyRaw(body, WOOD.md) + polyRaw(rect(-half + k, half - k, -r, -8), WOOD.lt) + polyRaw(rect(-half + k, half - k, -r, -20), WOOD.hi)
    + polyRaw(rect(-half + k, half - k, 14, r), WOOD.dk) + bands;
  const sil = polyRaw(body, "#000") + polyRaw(hl, "#000") + polyRaw(hr, "#000") + `<circle cx="${-half}" cy="0" r="${h}"/><circle cx="${half}" cy="0" r="${h}"/>`;
  return part(g(sil), g(art));
}
// obláčik múky pri valčeku (iba kresba, bez obrysu)
function flour(cx, cy, u) {
  if (u <= 0 || u >= 1) return part("", "");
  const a = Math.sin(Math.PI * u);
  const dots = [[-60, 6, 9], [-30, 16, 7], [10, 20, 10], [48, 12, 8], [72, 2, 6]].map(([dx, dy, rr], i) =>
    `<circle cx="${(cx + dx * (0.8 + u * 0.5)).toFixed(1)}" cy="${(cy + dy - 26 * u - (i % 2) * 8 * u).toFixed(1)}" r="${(rr * (0.6 + u)).toFixed(1)}" fill="#FFFFFF" opacity="${(0.75 * a).toFixed(2)}"/>`).join("");
  return part("", dots);
}

// ---------- mravec presne podľa predlohy (verzie 3–4) ----------
// vektor z obrázka: python3 tools/trace-logo.py design/ants/predloha/koncepty.png 40 105 280 310 3 design/ants/traced-zlucene.js design/ants/zlucit.json
// (koncept vľavo hore, spodný pravý dielik zlúčený s hlavou podľa zlucit.json); súradnice výrezu 840×930, do loga × TS
const TR = window.TRACED, TS = 0.5;
// pohyblivé časti: mnohouholník výrezu (aj s obrysom okolo) + kĺb, okolo ktorého sa otáča
const TPARTS = {
  ant: { pivot: [505, 286], poly: [[-60, 380], [40, 200], [180, -20], [480, -80], [660, -40], [680, 236], [560, 252], [520, 276], [472, 280], [432, 292], [380, 296], [345, 236], [240, 255], [140, 305], [40, 360]] },
  m1: { pivot: [185, 625], poly: [[-30, 600], [60, 560], [130, 575], [165, 600], [205, 652], [207, 690], [180, 720], [150, 760], [135, 820], [160, 880], [100, 940], [-30, 940]] },
  m2: { pivot: [340, 640], poly: [[275, 700], [292, 640], [300, 616], [390, 604], [440, 640], [452, 700], [452, 750], [466, 790], [420, 840], [360, 866], [250, 884], [190, 930], [150, 900], [230, 740]] },
};
const trLayers = (wrapPath) => TR.layers.filter((l) => l.name !== "obrys").map((l) => `<g transform="${l.transform}">${wrapPath(l)}</g>`).join("");
const trDefs = `<mask id="trBase" maskUnits="userSpaceOnUse" x="-400" y="-400" width="1700" height="1800"><rect x="-400" y="-400" width="1700" height="1800" fill="#fff"/>`
  + Object.values(TPARTS).map((p) => `<polygon points="${ptsRaw(p.poly)}" fill="#000"/>`).join("") + "</mask>"
  + Object.entries(TPARTS).map(([k, p]) => `<clipPath id="tr-${k}"><polygon points="${ptsRaw(p.poly)}"/></clipPath>`).join("")
  // farebné vrstvy iba vnútri čiernej plochy (na okraji predlohy ostali tenké prúžky)
  + (() => { const ink = TR.layers.find((l) => l.name === "ciara"); return `<clipPath id="trInk"><path transform="${ink.transform}" d="${ink.d}"/></clipPath>`; })();
// hlava z predlohy: telo bez pohyblivých častí + časti otočené o uhly (tykadlá, kusadlá); x, y = poloha v logu
function tracedAnt(x, y, ant, jaw) {
  const ang = { ant, m1: -jaw, m2: jaw }; // kusadlá sa zatvárajú k sebe (pri otvorení by medzi nimi vznikla diera)
  const pieces = (inner) => `<g transform="translate(${x} ${y}) scale(${TS})"><g mask="url(#trBase)">${inner}</g>`
    + Object.entries(TPARTS).map(([k, p]) => `<g transform="rotate(${ang[k].toFixed(2)} ${p.pivot[0]} ${p.pivot[1]})"><g clip-path="url(#tr-${k})">${inner}</g></g>`).join("") + "</g>";
  const ink = TR.layers.find((l) => l.name === "ciara");
  // obrys = čierna plocha (krémovú a čiernu linku okolo spraví filter v stickerF)
  const sil = pieces(`<g transform="${ink.transform}"><path d="${ink.d}"/></g>`);
  return part(sil, pieces(`<g clip-path="url(#trInk)">${trLayers((l) => `<path d="${l.d}" fill="${l.fill}"/>`)}</g>`));
}

// ---------- 4 verzie ----------
// fázy po sebe: tykadlá → kusadlá → predmet (menšia zmena na snímku = menší súbor)
const motion = (t) => ({ ant: wiggle(t, 0, 0.3, 9), jaw: t > 0.26 && t < 0.56 ? 16 * Math.abs(Math.sin(Math.PI * 2 * phase(t, 0.26, 0.56))) : 0 });
const VERSIONS = {
  // 1: presne podľa popisu – bez spodného pravého dielika, obracačka vedľa; na konci zamáva obracačkou
  1(t) {
    const m = motion(t);
    return sticker([...antennae(m.ant), head(false), mandibles(m.jaw), spatula(316, 506, -60 + wiggle(t, 0.58, 1, 26, 1.5), 270)]);
  },
  // 2: presne podľa popisu s valčekom; na konci sa valček zgúľa tam a späť
  2(t) {
    const m = motion(t);
    return sticker([...antennae(m.ant), head(false), mandibles(m.jaw), rollingPin(376, 438, -26, 250, -26 * Math.sin(2 * Math.PI * phase(t, 0.58, 1)))]);
  },
  // 3: mravec presne z predlohy (spodný dielik zlúčený s hlavou) + obracačka; tykadlá, kusadlá, zamávanie
  3(t) {
    const m = motion(t);
    return stickerF([tracedAnt(0, 0, m.ant * 0.7, m.jaw * 0.45), spatula(330, 500, -60 + wiggle(t, 0.58, 1, 26, 1.5), 260)], trDefs);
  },
  // 4: mravec presne z predlohy + valček, ktorý sa zgúľa a zvíri múku
  4(t) {
    const m = motion(t);
    const u = phase(t, 0.58, 1);
    return stickerF([tracedAnt(0, 0, m.ant * 0.7, m.jaw * 0.45), flour(372, 458, u), rollingPin(372, 456, -22, 250, -26 * Math.sin(2 * Math.PI * u))], trDefs);
  },
};
// prispôsobenie: zmeria logo vo všetkých polohách animácie a zmenší/vycentruje ho, aby sa celé zmestilo (okraj 20 px na obrys)
const FIT = {};
function fitOf(v) {
  if (FIT[v]) return FIT[v];
  const box = document.createElement("div");
  box.style.cssText = "position:absolute;left:-9999px;top:0";
  document.body.appendChild(box);
  let x1 = 1e9, y1 = 1e9, x2 = -1e9, y2 = -1e9;
  for (let i = 0; i <= 40; i++) {
    box.innerHTML = VERSIONS[v](i / 40);
    const b = box.querySelector("#all").getBBox();
    x1 = Math.min(x1, b.x); y1 = Math.min(y1, b.y); x2 = Math.max(x2, b.x + b.width); y2 = Math.max(y2, b.y + b.height);
  }
  box.remove();
  const pad = 22, k = Math.min((512 - 2 * pad) / (x2 - x1), (512 - 2 * pad) / (y2 - y1));
  return (FIT[v] = `translate(${(256 - k * (x1 + x2) / 2).toFixed(2)} ${(256 - k * (y1 + y2) / 2).toFixed(2)}) scale(${k.toFixed(4)})`);
}
const fitted = (v, t) => VERSIONS[v](t).replace('<g id="all">', `<g id="all" transform="${fitOf(v)}">`);
window.DESIGNS = { 1: (t) => fitted(1, t), 2: (t) => fitted(2, t), 3: (t) => fitted(3, t), 4: (t) => fitted(4, t) };

const q = new URLSearchParams(location.search);
if (q.has("v")) {
  document.body.className = "one";
  document.body.innerHTML = fitted(q.get("v"), Number(q.get("t") || 0));
  window.draw = (v, t) => { document.body.innerHTML = fitted(v, t); };
} else {
  // náhľad: rovnaké načasovanie ako WebP (pauza, animácia, pauza)
  document.body.className = "preview";
  const HOLD0 = 900, RUN = 1600, HOLD1 = 1200;
  const figs = Object.keys(VERSIONS).map((v) => { const f = document.createElement("figure"); document.body.appendChild(f); return [v, f]; });
  const t0 = performance.now();
  (function tick(now) {
    const ms = (now - t0) % (HOLD0 + RUN + HOLD1);
    const t = ms < HOLD0 ? 0 : ms < HOLD0 + RUN ? (ms - HOLD0) / RUN : 1;
    figs.forEach(([v, f]) => { f.innerHTML = fitted(v, t) + `<figcaption>Verzia ${v}</figcaption>`; });
    requestAnimationFrame(tick);
  })(t0);
}
</script>
</body>
