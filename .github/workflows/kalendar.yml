# Kalendár UPeCe → data/upece-kalendar.json (sekcia „Z UPeCe“ na webe FULky).
# Prečo cez GitHub: prehliadač nesmie čítať iCal priamo z upcba.sk (chýba CORS), takže ho sem každé 3 hodiny
# stiahne GitHub, prerobí na malý JSON (tools/kalendar.js) a uloží do repozitára – web ho potom číta ako vlastný súbor.
# Ručné spustenie: GitHub → repozitár → záložka Actions → „Kalendár UPeCe“ → Run workflow.
name: Kalendár UPeCe

# POZOR (26. 11. 2026): Cloudflare na upcba.sk vracia serverom GitHubu 403 (z domácej IP to ide) → plánované spúšťanie je vypnuté,
# kým web tím upcba.sk nepovolí tento odkaz (pravidlo vo WAF) alebo nepridá CORS hlavičku. Potom stačí odkomentovať schedule.
on:
  # schedule:
  #   - cron: "23 */3 * * *" # každé 3 hodiny, 23. minúta (čas v UTC = Bratislava − 1 h, v lete − 2 h)
  workflow_dispatch: {} # tlačidlo „Run workflow“

permissions:
  contents: write # uložiť nový JSON (commit)
  pages: write # po uložení spustiť nasadenie webu

concurrency:
  group: kalendar
  cancel-in-progress: false

jobs:
  kalendar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      # odkaz z tlačidla „Odoberať → Pridať do iného kalendára“ na upcba.sk/kalendar
      ICAL: "https://www.upcba.sk/?plugin=all-in-one-event-calendar&controller=ai1ec_exporter_controller&action=export_events&no_html=true"
      # Ako sa požiadavka predstaví – podľa toho ju web tím upcba.sk pustí cez Cloudflare (výnimka vo WAF):
      #  - User-Agent je verejný (repozitár je verejný), takže sám o sebe sa dá napodobniť – pre kalendár (verejné dáta) to nevadí,
      #  - X-FULka-Token = tajný kľúč dohodnutý s web tímom, uložený v GitHub → Settings → Secrets and variables → Actions
      #    pod menom UPECE_KALENDAR_TOKEN (v kóde ani v logu nie je). Kým tajomstvo nie je nastavené, hlavička sa neposiela.
      UA: "FULka-kalendar/1.0 (+https://ful.upcba.sk; GitHub Actions)"
    steps:
      - uses: actions/checkout@v4

      - name: Stiahnuť iCal z upcba.sk
        env:
          TOKEN: ${{ secrets.UPECE_KALENDAR_TOKEN }}
        run: |
          args=(-sS -L --retry 3 --max-time 60 -A "$UA" -D "$RUNNER_TEMP/hlavicky.txt" -o "$RUNNER_TEMP/upece.ics" -w "%{http_code}")
          if [ -n "$TOKEN" ]; then args+=(-H "X-FULka-Token: $TOKEN"); echo "Posielam aj X-FULka-Token."; fi
          code=$(curl "${args[@]}" "$ICAL")
          echo "upcba.sk odpovedal: HTTP $code"
          # pri chybe vypísať, čo treba web tímu (cf-ray = číslo požiadavky, podľa neho ju nájdu v Cloudflare → Security → Events)
          if [ "$code" != "200" ]; then grep -iE "^(cf-ray|cf-mitigated|server|date):" "$RUNNER_TEMP/hlavicky.txt" || true; exit 1; fi

      - name: iCal → JSON
        run: node tools/kalendar.js "$RUNNER_TEMP/upece.ics" data/upece-kalendar.json

      - name: Uložiť, ak sa kalendár zmenil
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- data/upece-kalendar.json; then echo "Kalendár sa nezmenil – nič sa neukladá."; exit 0; fi
          git diff --stat -- data/upece-kalendar.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/upece-kalendar.json
          git commit -m "Kalendár UPeCe: zmena na upcba.sk"
          git pull --rebase
          git push
          # commit z GitHub Action sám nasadenie webu nespustí → požiadať oň
          gh api -X POST "repos/${{ github.repository }}/pages/builds" > /dev/null && echo "Nasadenie webu spustené."
